<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$pagetitle$</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
$for(css)$
<link rel="stylesheet" href="$css$">
$endfor$
<style>
$highlighting-css$
</style>
<style>
/* The GitHub look comes from github-markdown-css, applied through the .markdown-body wrapper below.
   Everything here only adapts it from a web page to a printed page. */
@page {
  size: Letter; margin: 0.6in 0.65in 0.75in;
  /* Page numbers: Chrome draws the margin boxes itself, so no header or footer option is needed. */
  @bottom-center { content: "Page " counter(page) " of " counter(pages); font: 10px/1 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #59636e; }
}
html, body { margin: 0; background: #fff; }
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.markdown-body { max-width: none; padding: 0; font-size: 13px; }
/* Long lines in code blocks must wrap: on paper there is no sideways scrolling. */
.markdown-body pre { overflow: visible; white-space: pre-wrap; word-break: break-word; }
.markdown-body pre code { white-space: pre-wrap; word-break: break-word; }
.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { break-after: avoid; }
.markdown-body tr, .markdown-body img, .markdown-body blockquote { break-inside: avoid; }
</style>
</head>
<body>
<article class="markdown-body">
$body$
</article>
</body>
</html>
