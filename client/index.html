<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Printers</title>
  <!-- Tailwind Play CDN: no build step needed for a page this small. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="m-0 min-h-screen bg-[#111] p-4 font-sans text-neutral-100">
  <!--
    Cards are generated by app.js from /config.json (served by
    status_server.py's PRINTERS dict) -- add a printer there and a
    matching card appears here automatically, with no HTML to duplicate
    or keep in sync by hand.
  -->
  <div class="flex flex-wrap justify-center gap-4" id="printers"></div>

  <script src="app.js"></script>
</body>
</html>
